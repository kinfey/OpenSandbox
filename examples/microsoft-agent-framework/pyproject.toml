[project]
name = "microsoft-agent-framework-opensandbox"
version = "0.1.0"
description = "Microsoft Agent Framework workflow integration with OpenSandbox"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core==1.19.0",
    "agent-framework-openai==1.14.4",
    "opensandbox==1.1.0",
    # 1.1.0 wheel is missing committed FastPath gRPC stubs.
    "opensandbox-server==0.2.3",
    "python-dotenv>=1.0,<2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "microsoft-package-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true
